<script>
/* ================= CAT SURVIVORS (arcade game) ================= */
const CS = (() => {
/* ───────────── Cat Survivors · rules ─────────────
   Everything that decides what happens lives here and never touches the screen, so the same code can be
   played by a test bot. It advances in fixed 1/60 s steps; the renderer draws in between steps. */
const VW = 360, STEP = 1 / 60, WW = 760, WH = 940, TAU = Math.PI * 2, WALL_H = 54, GUN_Y = 14, GUN_R = 17;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rngOf = (seed) => { let a = seed | 0; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; };

const KIND = {
  sham:   { r: 11, hp: 26,   sp: 38, score: 10,   mass: 1,   stride: 0.050, col: "#9CBF7A", name: "Shambler" },
  runner: { r: 9,  hp: 14,   sp: 84, score: 15,   mass: 0.7, stride: 0.034, col: "#C2DB94", name: "Runner" },
  brute:  { r: 17, hp: 130,  sp: 27, score: 45,   mass: 3.2, stride: 0.052, col: "#6F9160", name: "Brute" },
  spit:   { r: 11, hp: 30,   sp: 34, score: 25,   mass: 1,   stride: 0.050, col: "#B79AC8", name: "Spitter" },
  chef:   { r: 26, hp: 3200, sp: 42, score: 600,  mass: 14,  stride: 0.036, col: "#86A86E", name: "The Head Chef", boss: true },
  king:   { r: 30, hp: 9000, sp: 38, score: 1500, mass: 18,  stride: 0.034, col: "#8FC3C9", name: "The Frozen King", boss: true },
};

const STAGES = [
  { id: "kitchen", name: "The Kitchen",    goal: 42,  cap: 12, gap: [0.95, 0.50], hpx: 1.00, mix: [["sham", 1]] },
  { id: "pantry",  name: "The Pantry",     goal: 62,  cap: 15, gap: [0.80, 0.42], hpx: 1.15, mix: [["sham", 0.68], ["runner", 0.32]] },
  { id: "garden",  name: "The Garden",     goal: 78,  cap: 18, gap: [0.70, 0.36], hpx: 1.30, mix: [["sham", 0.5], ["runner", 0.3], ["brute", 0.2]] },
  { id: "cellar",  name: "The Cellar",     goal: 56,  cap: 16, gap: [0.75, 0.42], hpx: 1.45, mix: [["sham", 0.5], ["runner", 0.3], ["brute", 0.2]], boss: "chef", dark: 0.46 },
  { id: "roof",    name: "The Rooftop",    goal: 94,  cap: 22, gap: [0.60, 0.32], hpx: 1.65, mix: [["sham", 0.36], ["runner", 0.26], ["brute", 0.14], ["spit", 0.24]] },
  { id: "grave",   name: "The Graveyard",  goal: 112, cap: 26, gap: [0.52, 0.28], hpx: 1.90, mix: [["sham", 0.42], ["runner", 0.28], ["brute", 0.15], ["spit", 0.15]], dark: 0.66 },
  { id: "arcade",  name: "The Arcade",     goal: 130, cap: 30, gap: [0.46, 0.24], hpx: 2.15, mix: [["sham", 0.26], ["runner", 0.4], ["brute", 0.14], ["spit", 0.2]] },
  { id: "freeze",  name: "The Deep Freeze", goal: 72, cap: 24, gap: [0.55, 0.30], hpx: 2.40, mix: [["sham", 0.34], ["runner", 0.3], ["brute", 0.18], ["spit", 0.18]], boss: "king", ice: true },
];

const UPS = [
  { id: "rapid",    name: "Rapid Paws",   text: "She fires faster.", max: 4 },
  { id: "heavy",    name: "Heavy Ball",   text: "Every ball hits harder.", max: 4 },
  { id: "twin",     name: "Twin Shot",    text: "One more ball in every volley.", max: 2 },
  { id: "zoom",     name: "Zoomies",      text: "She runs faster.", max: 3 },
  { id: "life",     name: "Ninth Life",   text: "One more heart, and every heart refilled.", max: 3 },
  { id: "through",  name: "Through Ball", text: "Balls carry on through one more zombie.", max: 3 },
  { id: "appetite", name: "Big Appetite", text: "More bowls of food, and Overdrive lasts longer.", max: 2 },
  { id: "fish",     name: "Fish Magnet",  text: "Treats fly to her from farther off and are worth more.", max: 2 },
];
const CATCHUP = ["rapid", "heavy", "zoom", "twin", "through", "life", "rapid"];   // what a stage-select start is handed

function statsOf(ups) {
  const n = (k) => ups[k] || 0;
  return {
    rate: 4.2 * (1 + 0.22 * n("rapid")), dmg: 10 + 4 * n("heavy"), shots: 1 + n("twin"), speed: 116 * (1 + 0.1 * n("zoom")),
    maxHp: 5 + n("life"), pierce: n("through"), odDur: 7 + 3 * n("appetite"), bowl: 0.03 + 0.02 * n("appetite"),
    magnet: 54 * (1 + 0.7 * n("fish")), treat: 5 + 3 * n("fish"),
  };
}
const comboMult = (c) => 1 + Math.min(4, Math.floor(c / 6)) * 0.5;

/* ---------- particles: a fixed pool, so nothing is allocated while playing ---------- */
const MAXP = 360;
function part(g, x, y, vx, vy, life, size, col, kind, grav) {
  if (g.headless) return;
  let p;
  if (g.pn < MAXP) p = g.parts[g.pn++]; else { p = g.parts[g.pi]; g.pi = (g.pi + 1) % MAXP; }
  p.x = x; p.y = y; p.vx = vx; p.vy = vy; p.life = life; p.max = life; p.size = size; p.col = col; p.kind = kind || 0; p.grav = grav || 0;
}
function burst(g, x, y, col, n, speed, size, kind) {
  for (let i = 0; i < n; i++) { const a = Math.random() * TAU, s = (speed || 120) * (0.35 + Math.random() * 0.65); part(g, x, y, Math.cos(a) * s, Math.sin(a) * s, 0.25 + Math.random() * 0.35, (size || 3) * (0.6 + Math.random() * 0.7), col, kind || 0, 0); }
}
function ring(g, x, y, col, size) { part(g, x, y, 0, 0, 0.38, size || 26, col, 2, 0); }
function text(g, x, y, s, col, big) { if (g.headless) return; if (g.texts.length > 16) g.texts.shift(); g.texts.push({ x, y, s, col, t: 0, big: !!big }); }

/* ---------- a new game, a new stage ---------- */
function newGame(o) {
  o = o || {};
  const g = {
    seed: o.seed || ((Date.now() ^ (Math.random() * 1e9)) & 0xffffff), vw: VW, vh: o.vh || 520, attract: !!o.attract, headless: !!o.headless,
    si: 0, ups: {}, score: 0, t: 0, ev: [], uid: 1, kills: 0, totalKills: 0,
    cat: { x: 0, y: 0, px: 0, py: 0, vx: 0, vy: 0, r: 11, hp: 5, inv: 0, face: 1, faceS: 1, aim: 0, ph: 0, recoil: 0, muzzle: 0, speed: 0, hasAim: false },
    enemies: [], balls: [], blobs: [], drops: [], texts: [], props: [], decals: [], splats: [],
    parts: [], pn: 0, pi: 0, cam: { x: 0, y: 0, px: 0, py: 0 }, starsRun: [],
  };
  for (let i = 0; i < MAXP; i++) g.parts.push({ x: 0, y: 0, vx: 0, vy: 0, life: 0, max: 1, size: 1, col: "#fff", kind: 0, grav: 0 });
  g.rand = rngOf(g.seed);
  const start = clamp(o.stage || 0, 0, STAGES.length - 1);
  for (let i = 0; i < start; i++) { const id = CATCHUP[i % CATCHUP.length]; g.ups[id] = (g.ups[id] || 0) + 1; }
  g.S = statsOf(g.ups); g.cat.hp = g.S.maxHp; g.si = start; g.first = true;
  setupStage(g);
  return g;
}

const PROP_R = { crate: 15, barrel: 14, sack: 13, pot: 12, bush: 16, rock: 14, stone: 12, stump: 12, chimney: 15, vent: 14, cabinet: 15, ice: 15, snow: 15, lantern: 8, stool: 10, planter: 14 };
const STAGE_PROPS = {
  kitchen: ["crate", "sack", "stool", "pot"], pantry: ["barrel", "sack", "crate"], garden: ["bush", "rock", "planter", "bush"], cellar: ["barrel", "crate", "barrel", "lantern"],
  roof: ["chimney", "vent", "planter"], grave: ["stone", "stone", "stump", "lantern"], arcade: ["cabinet", "stool", "cabinet"], freeze: ["ice", "snow", "crate", "ice"],
};

function setupStage(g) {
  const st = STAGES[g.si], c = g.cat;
  g.stage = st; g.mode = "intro"; g.modeT = 0; g.st = 0; g.kills = 0; g.spawned = 0; g.spawnT = 0.6; g.dmgTaken = 0;
  g.bossUp = false; g.bossT = 0; g.boss = null; g.bossDead = false; g.bossBowl = false; g.banner = "stage"; g.bannerT = 0;
  g.combo = 0; g.comboT = 0; g.bestCombo = 0; g.od = 0; g.fireT = 0; g.shake = 0; g.hurt = 0; g.slow = 0; g.hitstop = 0; g.bowls = 0; g.flash = 0;
  g.enemies.length = 0; g.balls.length = 0; g.blobs.length = 0; g.drops.length = 0; g.texts.length = 0; g.splats.length = 0; g.pn = 0; g.pi = 0;
  g.S = statsOf(g.ups);
  if (!g.first) c.hp = Math.min(g.S.maxHp, c.hp + 1);
  g.first = false;
  c.x = c.px = WW / 2; c.y = c.py = WH / 2; c.vx = c.vy = 0; c.inv = 0; c.recoil = 0; c.muzzle = 0; c.hasAim = false;
  g.snap = { score: g.score, hp: c.hp, ups: Object.assign({}, g.ups), si: g.si, totalKills: g.totalKills };
  const r = rngOf(g.seed * 31 + g.si * 977 + 5), kinds = STAGE_PROPS[st.id];
  g.props.length = 0;
  for (let i = 0, tries = 0; i < 11 && tries < 400; tries++) {
    const k = kinds[Math.floor(r() * kinds.length)], x = 46 + r() * (WW - 92), y = 60 + r() * (WH - 110), pr = PROP_R[k];
    if (Math.hypot(x - WW / 2, y - WH / 2) < 120) continue;

const norm = (s) => String(s || "").toLowerCase().trim().replace(/(es|s)$/, "");
const findItem = (name, inv) => {
  const n = norm(name);
  if (!n) return null;
  return inv.find((i) => {
    const m = norm(i.name);
    return m === n || n.length > 3 && m.includes(n) || m.length > 3 && n.includes(m);
  });
};
